name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Optional: pull content from another repository before building.
      # Configure the `CONTENT_REPO` repository variable (`owner/name`) and,
      # for private repositories, a `CONTENT_REPO_TOKEN` secret with read
      # access. A public repository can use the default token. Local content
      # in `src/content/` takes precedence over external content.
      - name: Checkout external content
        if: vars.CONTENT_REPO != ''
        uses: ./.github/actions/checkout-content
        with:
          repository: ${{ vars.CONTENT_REPO }}
          ref: ${{ vars.CONTENT_REPO_REF || 'main' }}
          token: ${{ secrets.CONTENT_REPO_TOKEN || github.token }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
